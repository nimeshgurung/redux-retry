<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Loading, a response, or a way to try again. See redux-retry running in CodeSandbox."
    />
    <title>redux-retry · Live examples</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color: #151515;
        background: #f4f1e8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      main {
        width: min(100% - 40px, 1120px);
        margin: 24px auto;
      }
      nav,
      .examples {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      nav {
        margin-bottom: 12px;
        font-size: 14px;
      }
      a {
        color: inherit;
        text-underline-offset: 4px;
      }
      .wordmark {
        display: block;
        width: 240px;
        height: auto;
      }
      .examples {
        margin-bottom: 12px;
        font-size: 13px;
      }
      select {
        margin-left: 6px;
        font: inherit;
        padding: 8px;
        color: inherit;
        border: 1px solid #151515;
        border-radius: 5px;
        background: #fffdf7;
      }
      iframe {
        display: block;
        width: 100%;
        height: 760px;
        border: 1px solid #151515;
        border-radius: 8px;
        background: #fffdf7;
      }
      a:focus-visible,
      select:focus-visible {
        outline: 3px solid #0755ff;
        outline-offset: 4px;
      }
      @media (max-width: 500px) {
        main {
          width: calc(100% - 24px);
        }
        .examples {
          align-items: end;
        }
        iframe {
          height: 660px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <nav aria-label="Project">
        <a href="https://github.com/nimeshgurung/redux-retry" aria-label="redux-retry on GitHub"
          ><img
            class="wordmark"
            src="https://raw.githubusercontent.com/nimeshgurung/redux-retry/v1.0.0-beta.1/assets/logos/blue-nodes.png"
            alt="redux-retry"
            width="240"
            height="109"
        /></a>
      </nav>
      <div class="examples">
        <label
          >Example
          <select id="sandbox-choice">
            <option value="thunk">Thunk</option>
            <option value="saga">Saga</option>
          </select></label
        >
        <a
          id="open-sandbox"
          href="https://codesandbox.io/p/sandbox/basic-redux-saga-forked-cfky67"
          target="_blank"
          rel="noopener noreferrer"
          >Open in CodeSandbox ↗</a
        >
      </div>
      <iframe
        id="sandbox-example"
        title="redux-retry Thunk example"
        src="https://codesandbox.io/embed/cfky67?view=preview&amp;module=%2Findex.js&amp;hidenavigation=1"
        sandbox="allow-forms allow-modals allow-popups allow-same-origin allow-scripts"
      ></iframe>
    </main>
    <script type="module">
      const sandboxes = {
        thunk: {
          id: 'cfky67',
          url: 'https://codesandbox.io/p/sandbox/basic-redux-saga-forked-cfky67',
        },
        saga: {
          id: '35jv48',
          url: 'https://codesandbox.io/p/sandbox/basic-redux-saga-forked-35jv48',
        },
      };
      document.getElementById('sandbox-choice').addEventListener('change', (event) => {
        const example = sandboxes[event.target.value];
        const frame = document.getElementById('sandbox-example');
        frame.src = `https://codesandbox.io/embed/${example.id}?view=preview&module=%2Findex.js&hidenavigation=1`;
        frame.title = `redux-retry ${event.target.value === 'thunk' ? 'Thunk' : 'Saga'} example`;
        document.getElementById('open-sandbox').href = example.url;
      });
    </script>
  </body>
</html>
