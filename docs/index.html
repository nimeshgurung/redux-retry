  <head>

    <style>
      :root {
        font-family: system-ui, sans-serif;
        color: #f4f1e8;
        background: #181a18;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      main {
        width: min(100% - 40px, 1120px);
        margin: 24px auto;
      }
      nav,
      .examples {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      nav {
        flex-wrap: wrap;
        margin-bottom: 12px;
        font-size: 14px;
      }
      .project-links {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 18px;
      }
      .project-links a,
      .install-command {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
      }
      .install-command {
        display: inline-flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 8px 12px;
        border: 1px solid #5c615b;
        border-radius: 6px;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      .install-command code {
        font:
          13px ui-monospace,
          monospace;
      }
      .copy-label {
        color: #c8c7bd;
        font:
          12px system-ui,
          sans-serif;
      }
      .project-links img {
        display: block;
        height: 20px;
      }
      a {
        color: inherit;
        text-underline-offset: 4px;
      }
      .intro {
        margin-bottom: 24px;
      }
      .tagline {
        margin: 0 0 10px;
        font-family: Arial, sans-serif;
        font-size: clamp(24px, 3vw, 34px);
        font-style: italic;
        font-weight: 700;
        letter-spacing: -0.035em;
        line-height: 1.1;
        text-wrap: balance;
      }
      .description {
        max-width: 64ch;
        margin: 0;
        color: #c8c7bd;
        font-size: 16px;
        line-height: 1.6;
        text-wrap: pretty;
      }
      .description code {
        color: #f4f1e8;
        font-family: ui-monospace, monospace;
        font-size: 0.9em;
      }
      .wordmark {
        display: block;
        width: 240px;
        height: auto;
      }
      .examples {
        margin: 6px 0 22px;
        font-size: 13px;
      }
      .modes {
        display: flex;
        gap: 14px;
      }
      .mode {
        display: grid;
        gap: 4px;
        min-width: 152px;
        padding: 12px 22px;
        color: inherit;
        border: 2px solid #f4f1e8;
        border-radius: 9px 14px 10px 12px;
        background: #242724;
        text-align: left;
        cursor: pointer;
        transform: rotate(-2deg);
        transition:
          background-color 160ms,
          color 160ms,
          transform 160ms;
      }
      .mode + .mode {
        transform: rotate(2deg);
      }
      .mode strong {
        font:
          italic 850 28px/1 system-ui,
          sans-serif;
        letter-spacing: -1px;
      }
      .mode span {
        font:
          11px ui-monospace,
          monospace;
      }
      .mode[aria-pressed='true'] {
        color: #fff;
        background: #0755ff;
      }
      .mode:hover {
        transform: translateY(-3px) rotate(0deg);
      }
      .mode:active {
        transform: translateY(1px) rotate(0deg);
      }
      iframe {
        display: block;
        width: 100%;
        height: 760px;
        border: 1px solid #5c615b;
        border-radius: 8px;
        background: #181a18;
      }
      a:focus-visible,
      button:focus-visible {
        outline: 3px solid #0755ff;
        outline-offset: 4px;
      }
      @media (max-width: 500px) {
        main {
          width: calc(100% - 24px);
        }
        .project-links {
          display: grid;
          width: 100%;
          grid-template-columns: 1fr auto;
        }
        .install-command {
          grid-column: 1 / -1;
        }
        .examples {
          align-items: start;
          flex-direction: column;
          gap: 20px;
        }
        .modes {
          width: 100%;
        }
        .mode {
          min-width: 0;
          flex: 1;
          padding: 12px 16px;
        }
        iframe {
          height: 660px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .mode {
          transition: none;
        }
        .mode:hover,
        .mode:active {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <nav aria-label="Project">
        <a href="https://github.com/nimeshgurung/redux-retry" aria-label="redux-retry on GitHub"
          ><img
            class="wordmark"
            src="https://raw.githubusercontent.com/nimeshgurung/redux-retry/v1.0.0-beta.1/assets/logos/blue-nodes.png"
            alt="redux-retry"
            width="240"
            height="109"
        /></a>
        <div class="project-links">
          <button
            id="install-command"
            class="install-command"
            type="button"
            aria-label="Copy npm install redux-retry@next"
          >
            <code>npm install redux-retry@next</code>
            <span class="copy-label" aria-live="polite">Copy</span>
          </button>
          <a
            href="https://www.npmjs.com/package/redux-retry/v/1.0.1"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="View weekly npm downloads across all versions"
            title="Weekly npm downloads across all versions"
            ><img
              src="https://img.shields.io/npm/dw/redux-retry?style=flat-square&amp;label=npm%20downloads&amp;color=0755ff&amp;labelColor=242724"
              alt="Weekly npm downloads"
              height="20"
          /></a>
          <a
            href="https://github.com/nimeshgurung/redux-retry"
            target="_blank"
            rel="noopener noreferrer"
            >GitHub ↗</a
          >
        </div>
      </nav>
      <section class="intro" aria-label="About redux-retry">
        <h1 class="tagline">Async requests. Less Redux boilerplate.</h1>
        <p class="description">
          Use <code>Retry</code> or <code>useRetry</code> to handle loading, success, and errors
          with Redux Saga or Thunk. When a request fails, give users a way to try again.
        </p>
      </section>
      <div class="examples">
        <div class="modes" role="group" aria-label="Choose an example">
          <button class="mode" type="button" data-example="thunk" aria-pressed="true">
            <strong>Thunk</strong><span>async / await</span>
          </button>
          <button class="mode" type="button" data-example="saga" aria-pressed="false">
            <strong>Saga</strong><span>yield / call</span>
          </button>
        </div>
        <a
          id="open-sandbox"
          href="https://codesandbox.io/p/sandbox/basic-redux-saga-forked-cfky67"
          target="_blank"
          rel="noopener noreferrer"
          >Open in CodeSandbox ↗</a
        >
      </div>
      <iframe
        id="sandbox-example"
        title="redux-retry Thunk example"
        src="https://codesandbox.io/embed/cfky67?view=preview&amp;module=%2Findex.js&amp;hidenavigation=1"
        sandbox="allow-forms allow-modals allow-popups allow-same-origin allow-scripts"
      ></iframe>
    </main>
    <script type="module">
      const installButton = document.getElementById('install-command');
      const copyLabel = installButton.querySelector('.copy-label');
      let copyTimer;
      installButton.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(
            installButton.querySelector('code').textContent.trim(),
          );
          clearTimeout(copyTimer);
          copyLabel.textContent = 'Copied';
          copyTimer = setTimeout(() => {
            copyLabel.textContent = 'Copy';
          }, 2000);
        } catch {
          copyLabel.textContent = 'Copy failed';
        }
      });
      const sandboxes = {
        thunk: {
          id: 'cfky67',
          url: 'https://codesandbox.io/p/sandbox/basic-redux-saga-forked-cfky67',
        },
        saga: {
          id: '35jv48',
          url: 'https://codesandbox.io/p/sandbox/basic-redux-saga-forked-35jv48',
        },
      };
      const modes = [...document.querySelectorAll('[data-example]')];
      for (const mode of modes) {
        mode.addEventListener('click', () => {
          if (mode.getAttribute('aria-pressed') === 'true') return;
          const kind = mode.dataset.example;
          const example = sandboxes[kind];
          for (const button of modes) button.setAttribute('aria-pressed', String(button === mode));
          const frame = document.getElementById('sandbox-example');
          frame.src = `https://codesandbox.io/embed/${example.id}?view=preview&module=%2Findex.js&hidenavigation=1`;
          frame.title = `redux-retry ${kind === 'thunk' ? 'Thunk' : 'Saga'} example`;
          document.getElementById('open-sandbox').href = example.url;
        });
      }
    </script>
  </body>
</html>
