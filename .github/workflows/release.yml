name: Publish to npm
on:
  workflow_dispatch:
    inputs:
      legacy:
        description: Publish the documentation-only legacy 0.0.8 release
        type: boolean
        required: true
        default: false
      tag:
        description: npm release channel
        type: choice
        required: true
        default: next
        options:
          - next
          - latest

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - run: npm ci
      - name: Check release version
        id: release
        env:
          NPM_DIST_TAG: ${{ inputs.tag }}
          LEGACY_RELEASE: ${{ inputs.legacy }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          const name = manifest.name;
          const legacy = process.env.LEGACY_RELEASE === 'true';
          const version = legacy ? '0.0.8' : manifest.version;
          const versions = JSON.parse(execFileSync('npm', ['view', name, 'versions', '--json'], { encoding: 'utf8' }));
          if (versions.includes(version)) throw new Error(`${name}@${version} is already published. Bump the version first.`);
          const tag = process.env.NPM_DIST_TAG;
          if (!['next', 'latest'].includes(tag)) throw new Error('Choose next or latest as the npm channel.');
          if (legacy && tag !== 'latest') throw new Error('The legacy documentation release must use latest; next is reserved for 1.x.');
          if (tag === 'latest' && version.includes('-')) throw new Error('Publish prereleases under next.');
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ntag=${tag}\n`);
          JS
      - if: ${{ !inputs.legacy }}
        run: npx playwright install --with-deps chromium
      - if: ${{ !inputs.legacy }}
        run: npm run test:compat -- --react=19 --e2e --chromium-only --live --metro
      - if: ${{ inputs.legacy }}
        run: npm run test:legacy
      - name: Publish verified package
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DIST_TAG: ${{ steps.release.outputs.tag }}
          LEGACY_RELEASE: ${{ inputs.legacy }}
        run: |
          if [ "$LEGACY_RELEASE" = "true" ]; then
            npm publish ".compat/legacy/redux-retry-$VERSION.tgz" --tag "$DIST_TAG" --provenance
          else
            npm publish ".compat/redux-retry-$VERSION.tgz" --tag "$DIST_TAG" --provenance
          fi
