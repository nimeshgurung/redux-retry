name: Verify beta
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run format:check
      - run: npm audit --audit-level=moderate
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        react: [18, 19]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:compat -- --react=${{ matrix.react }} --e2e --metro
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compatibility-node-${{ matrix.node }}-react-${{ matrix.react }}
          include-hidden-files: true
          path: |
            .compat/report-node-*.json
            .compat/react-*/test-results/
          if-no-files-found: error
