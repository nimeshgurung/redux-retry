<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>redux-retry thunk example</title>
    <link
      rel="icon"
      type="image/png"
      href="https://raw.githubusercontent.com/nimeshgurung/redux-retry/a6cabd9ca4384b5e9324a7773f0060919a0f8444/docs/retry-sticker.png"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="redux-retry thunk example" />
    <meta
      property="og:description"
      content="Loading, a response, or a way to try again. See redux-retry running in CodeSandbox."
    />
    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/nimeshgurung/redux-retry/v1.0.0-beta.1/assets/logos/blue-nodes.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1886" />
    <meta property="og:image:height" content="834" />
    <meta property="og:image:alt" content="redux-retry blue nodes sticker logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="redux-retry thunk example" />
    <meta
      name="twitter:description"
      content="Loading, a response, or a way to try again. See redux-retry running in CodeSandbox."
    />
    <meta
      name="twitter:image"
      content="https://raw.githubusercontent.com/nimeshgurung/redux-retry/v1.0.0-beta.1/assets/logos/blue-nodes.png"
    />
    <meta name="twitter:image:alt" content="redux-retry blue nodes sticker logo" />
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color: #151515;
        background: #181a18;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      #root {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .loading {
        text-align: center;
        color: #f4f1e8;
      }
      .spinner {
        width: 84px;
        height: 84px;
        display: block;
        margin: 0 auto 12px;
        animation: spin 1.5s linear infinite;
      }
      .card {
        color: #151515;
        width: min(100%, 400px);
        padding: 28px;
        border: 2px solid #151515;
        border-radius: 12px;
        background: #fffdf7;
      }
      .label {
        margin: 0 0 12px;
        color: #55534f;
        font:
          12px ui-monospace,
          monospace;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 26px;
        letter-spacing: -0.7px;
      }
      .response {
        margin: 0 0 24px;
        line-height: 1.6;
      }
      .response strong {
        display: block;
        font-size: 20px;
      }
      .response span {
        display: block;
        color: #55534f;
        font-size: 14px;
      }
      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      button {
        min-height: 44px;
        padding: 10px 16px;
        border: 1px solid #151515;
        border-radius: 6px;
        background: #0755ff;
        color: white;
        font:
          650 14px system-ui,
          sans-serif;
        cursor: pointer;
      }
      button.secondary {
        background: transparent;
        color: #151515;
      }
      button:focus-visible {
        outline: 3px solid #0755ff;
        outline-offset: 4px;
      }
      .attempts {
        margin: 18px 0 0;
        color: #65615b;
        font:
          11px ui-monospace,
          monospace;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.jsx"></script>
  </body>
</html>
